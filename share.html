<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<title>橙园直供 · 扫码下单 | 当季鲜橙产地直发</title>
<meta name="description" content="自家脐橙庄园，现摘现发，坏果包赔！满3箱包邮，扫码下单→" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="share-page">
  <div class="share-card">
    <div class="sc-hero" style="background-image:url('assets/img/hero.jpg')"></div>
    <div class="sc-content">
      <h2>橙园直供</h2>
      <p class="sc-desc">自家脐橙庄园 · 现摘现发 · 坏果包赔<br>满3箱包邮，当季鲜橙产地直达</p>

      <div class="sc-qr" id="qrBox">
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px">二维码生成中…</div>
      </div>

      <p class="sc-qr-hint">长按识别二维码 · 进入店铺下单</p>

      <a href="index.html" class="btn btn-primary btn-block sc-btn">直接进入店铺</a>
      <a href="index.html#products" class="btn btn-ghost btn-block" style="margin-top:8px">查看鲜橙选购</a>
    </div>
  </div>

  <div style="margin-top:24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8">
    <p>🌳 自家果园 · 自然成熟 · 手工筛选</p>
    <p>🚚 产地直发 · 48小时内发货</p>
    <p>🎁 精美礼盒 · 烫金提袋 · 节日送礼</p>
    <p style="margin-top:16px">© 2026 橙园直供 · 自家脐橙庄园</p>
  </div>
</div>

<script>
(function(){
  // 动态获取当前网址（去掉 share.html），生成店铺二维码
  var origin = location.origin;
  var shopUrl = origin + "/";  // 店铺首页
  var qrBox = document.getElementById("qrBox");
  if(qrBox){
    var img = document.createElement("img");
    img.onload = function(){ qrBox.innerHTML = ""; qrBox.appendChild(img); };
    img.onerror = function(){
      qrBox.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;padding:12px;text-align:center">二维码加载失败<br>请直接点击下方按钮</div>';
    };
    img.src = origin + "/api/qrcode?text=" + encodeURIComponent(shopUrl);
    img.alt = "店铺二维码";
  }
})();
</script>
</body>
</html>
