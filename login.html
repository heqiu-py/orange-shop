<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>登录 · 橙园直供</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  body { background: linear-gradient(135deg, var(--green-50) 0%, #fff 50%, var(--orange-50) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: #fff; border-radius: 24px; box-shadow: 0 8px 40px rgba(31,74,46,0.12); max-width: 440px; width: 100%; overflow: hidden; }
  .auth-head { background: linear-gradient(135deg, var(--green) 0%, var(--green-700) 100%); padding: 40px 36px 32px; text-align: center; color: #fff; }
  .auth-head .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--orange); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .auth-head h1 { font-family: var(--font-serif); font-size: 24px; margin: 0 0 6px; }
  .auth-head p { font-size: 14px; opacity: 0.85; margin: 0; }
  .auth-tabs { display: flex; border-bottom: 2px solid var(--line); }
  .auth-tab { flex: 1; padding: 16px; text-align: center; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .auth-tab.on { color: var(--green); border-bottom-color: var(--green); }
  .auth-body { padding: 28px 36px 36px; }
  .auth-field { margin-bottom: 16px; }
  .auth-field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
  .auth-field input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-family: var(--font-sans); transition: border-color .2s; box-sizing: border-box; }
  .auth-field input:focus { border-color: var(--green); outline: none; }
  .auth-field .input-wrap { position: relative; }
  .auth-field .toggle-pwd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); font-size: 18px; user-select: none; }
  .auth-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--green); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; margin-top: 8px; }
  .auth-btn:hover { background: var(--green-700); }
  .auth-btn:active { transform: scale(0.98); }
  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-mode-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .auth-mode-switch a { color: var(--green); font-weight: 600; cursor: pointer; text-decoration: none; }
  .auth-error { background: #fef2f2; color: #b0413e; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
  .auth-error.show { display: block; }
  .auth-divider { text-align: center; margin: 24px 0; position: relative; }
  .auth-divider::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--line); }
  .auth-divider span { background: #fff; padding: 0 12px; color: var(--muted); font-size: 13px; position: relative; z-index: 1; }
  .auth-admin-link { text-align: center; }
  .auth-admin-link a { color: var(--muted); font-size: 13px; text-decoration: none; cursor: pointer; }
  .auth-admin-link a:hover { color: var(--green); }
  .auth-referral-banner { background: var(--orange-50); border: 1px solid var(--orange-100); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; display: none; font-size: 13px; color: var(--orange-700); }
  .auth-referral-banner.show { display: block; }
  .auth-referral-banner strong { color: var(--orange-700); }
  .auth-back { position: fixed; top: 20px; left: 20px; color: var(--muted); text-decoration: none; font-size: 14px; z-index: 10; }
  .auth-back:hover { color: var(--green); }
  @media (max-width: 480px) {
    .auth-body { padding: 20px 24px 28px; }
    .auth-head { padding: 32px 24px 24px; }
  }
</style>
</head>
<body>

<a href="index.html" class="auth-back">← 返回店铺</a>

<div class="auth-card">
  <div class="auth-head">
    <div class="mark">🍊</div>
    <h1>橙园直供</h1>
    <p>当季鲜橙 · 产地直发</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab on" id="tabLogin" onclick="AuthPage.switchTab('login')">登录</div>
    <div class="auth-tab" id="tabRegister" onclick="AuthPage.switchTab('register')">注册</div>
  </div>

  <div class="auth-body">
    <!-- 推荐人提示 -->
    <div class="auth-referral-banner" id="referralBanner">
      您是通过 <strong id="referralAgentName"></strong> 的推荐链接来的，注册后将自动关联该代理
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- 登录表单 -->
    <div id="loginForm">
      <div class="auth-field">
        <label>手机号</label>
        <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11" />
      </div>
      <div class="auth-field">
        <label>密码</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" placeholder="请输入密码" />
          <span class="toggle-pwd" onclick="AuthPage.togglePwd('loginPassword')">👁</span>
        </div>
      </div>
      <button class="auth-btn" id="loginBtn" onclick="AuthPage.doLogin()">登录</button>
      <div class="auth-mode-switch">
        还没有账号？<a onclick="AuthPage.switchTab('register')">立即注册</a>
      </div>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" style="display:none">
      <div class="auth-field">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="请输入手机号" maxlength="11" />
      </div>
      <div class="auth-field">
        <label>昵称（选填）</label>
        <input type="text" id="regName" placeholder="您的称呼" />
      </div>
      <div class="auth-field">
        <label>密码</label>
        <div class="input-wrap">
          <input type="password" id="regPassword" placeholder="至少6位" />
          <span class="toggle-pwd" onclick="AuthPage.togglePwd('regPassword')">👁</span>
        </div>
      </div>
      <div class="auth-field">
        <label>确认密码</label>
        <input type="password" id="regPassword2" placeholder="再输入一次" />
      </div>
      <button class="auth-btn" id="registerBtn" onclick="AuthPage.doRegister()">注册并登录</button>
      <div class="auth-mode-switch">
        已有账号？<a onclick="AuthPage.switchTab('login')">去登录</a>
      </div>
    </div>

    <div class="auth-divider"><span>或</span></div>

    <div class="auth-admin-link">
      <a onclick="AuthPage.goAdminLogin()">管理员 / 代理入口 →</a>
    </div>
  </div>
</div>

<!-- toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/js/store.js"></script>
<script>
(function (global) {
  "use strict";

  const $ = s => document.querySelector(s);
  const redirect = new URLSearchParams(location.search).get("redirect") || "";

  function toast(msg, type) {
    const wrap = $("#toastWrap"); if (!wrap) return;
    const el = document.createElement("div");
    el.className = "toast " + (type || "ok");
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 1800);
    setTimeout(() => el.remove(), 2200);
  }

  function showError(msg) {
    const e = $("#authError");
    if (msg) { e.textContent = msg; e.classList.add("show"); }
    else { e.classList.remove("show"); }
  }

  function doRedirect() {
    if (redirect) location.href = redirect;
    else location.href = "index.html";
  }

  const AuthPage = {
    switchTab(tab) {
      const isLogin = tab === "login";
      $("#tabLogin").classList.toggle("on", isLogin);
      $("#tabRegister").classList.toggle("on", !isLogin);
      $("#loginForm").style.display = isLogin ? "block" : "none";
      $("#registerForm").style.display = isLogin ? "none" : "block";
      showError("");
    },

    togglePwd(id) {
      const inp = $("#" + id);
      inp.type = inp.type === "password" ? "text" : "password";
    },

    async doLogin() {
      const phone = $("#loginPhone").value.trim();
      const password = $("#loginPassword").value;
      if (!phone || !password) { showError("请填写手机号和密码"); return; }
      if (!/^1\d{10}$/.test(phone)) { showError("手机号格式不正确"); return; }

      const btn = $("#loginBtn");
      btn.disabled = true; btn.textContent = "登录中…";
      showError("");

      try {
        await Store.Auth.login(phone, password);
        toast("登录成功");
        setTimeout(doRedirect, 600);
      } catch (e) {
        showError(e.message);
        btn.disabled = false; btn.textContent = "登录";
      }
    },

    async doRegister() {
      const phone = $("#regPhone").value.trim();
      const name = $("#regName").value.trim();
      const password = $("#regPassword").value;
      const password2 = $("#regPassword2").value;
      if (!phone || !password) { showError("请填写手机号和密码"); return; }
      if (!/^1\d{10}$/.test(phone)) { showError("手机号格式不正确"); return; }
      if (password.length < 6) { showError("密码至少6位"); return; }
      if (password !== password2) { showError("两次密码不一致"); return; }

      const btn = $("#registerBtn");
      btn.disabled = true; btn.textContent = "注册中…";
      showError("");

      try {
        await Store.Auth.register(phone, password, name);
        toast("注册成功，已自动登录");
        setTimeout(doRedirect, 600);
      } catch (e) {
        showError(e.message);
        btn.disabled = false; btn.textContent = "注册并登录";
      }
    },

    goAdminLogin() {
      location.href = "login.html?mode=admin" + (redirect ? "&redirect=" + encodeURIComponent(redirect) : "");
    },

    async init() {
      // 检查推荐人
      const refCode = Store.getReferralCode();
      if (refCode) {
        try {
          // 预加载商品和常量（用于解析推荐码）
          await Store.initCustomer();
          if (Store.cache.referralAgent) {
            $("#referralAgentName").textContent = Store.cache.referralAgent.name;
            $("#referralBanner").classList.add("show");
          }
        } catch (e) {}
      }
      // 如果已登录，直接跳转
      try {
        const user = await Store.Auth.me();
        if (user) { doRedirect(); return; }
      } catch (e) {}

      // 管理员模式
      const mode = new URLSearchParams(location.search).get("mode");
      if (mode === "admin") {
        this.setupAdminMode();
      }
    },

    setupAdminMode() {
      // 切换为管理员登录界面
      $("#tabRegister").style.display = "none";
      $(".auth-mode-switch").innerHTML = '管理员 / 代理请使用手机号和密码登录';
      $(".auth-admin-link").style.display = "none";
      // 改用 admin-login 接口
      const origLogin = this.doLogin;
      this.doLogin = async function () {
        const phone = $("#loginPhone").value.trim();
        const password = $("#loginPassword").value;
        if (!phone || !password) { showError("请填写手机号和密码"); return; }
        if (!/^1\d{10}$/.test(phone)) { showError("手机号格式不正确"); return; }
        const btn = $("#loginBtn");
        btn.disabled = true; btn.textContent = "登录中…";
        showError("");
        try {
          await Store.Auth.adminLogin(phone, password);
          toast("登录成功");
          const user = Store.Auth.getUser();
          setTimeout(() => {
            if (user.role === "agent") location.href = "agent.html";
            else if (redirect) location.href = redirect;
            else location.href = "admin.html";
          }, 600);
        } catch (e) {
          showError(e.message);
          btn.disabled = false; btn.textContent = "登录";
        }
      };
    },
  };

  // 回车提交
  $("#loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") AuthPage.doLogin(); });
  $("#regPassword2").addEventListener("keydown", e => { if (e.key === "Enter") AuthPage.doRegister(); });

  global.AuthPage = AuthPage;
  AuthPage.init();
})(window);
</script>
</body>
</html>
